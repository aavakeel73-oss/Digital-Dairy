plugins { id 'com.android.application' }

android {
    namespace 'com.onlineindia.chronicle'
    compileSdk 35

    defaultConfig {
        applicationId 'com.onlineindia.chronicle'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
}


dependencies {
    // Native Google account chooser. Firebase sign-in is completed in existing WebView JS.
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
